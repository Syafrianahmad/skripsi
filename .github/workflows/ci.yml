# Runs lint, tests, and a production build on every pull request and every push to develop and main,
# so a bad change (for example a Dependabot bump) shows up red before it is merged into main.
# Deploying is a separate workflow (deploy.yml, push to main).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# a newer push to the same branch or PR makes the older run pointless
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to a commit SHA (the tag is in the comment); Dependabot bumps them
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci fails on a dependency conflict (ERESOLVE), which is exactly what we want to catch
      - run: npm ci
      # fails on a high or critical advisory in production dependencies
      - run: npm audit --omit=dev --audit-level=high
      # fails when an installed package does not match its registry signature
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run test

      - name: Build (same base path as the deploy)
        run: |
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          npm run build

      # vite.config.ts leaves dist.test.ts out of `npm run test` on CI while dist/ is missing (the build comes later).
      # This run checks the fresh build; without dist/ vitest finds no test file and the step fails.
      - run: npx vitest run dist.test.ts

      - name: Size budget (JS gzip and woff2)
        run: npm run size

      - name: Playwright version (cache key)
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # browsers are big; the key is the exact Playwright version, so a bump starts a fresh cache
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # headless shell is what Playwright uses for headless Chromium; --with-deps adds the OS libraries
      - run: npx playwright install --with-deps chromium-headless-shell

      - name: E2E (production build under the Pages sub-path)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
