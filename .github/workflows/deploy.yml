# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer push replaces a queued one but never cancels a running deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to a commit SHA (the tag is in the comment); Dependabot bumps them
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # fails on a high or critical advisory in production dependencies
      - run: npm audit --omit=dev --audit-level=high
      # fails when an installed package does not match its registry signature
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run test

      - name: Build
        run: |
          # https://<owner>.github.io/<repo>/ : the site lives under the repo name
          export VITE_SITE_ORIGIN="https://${GITHUB_REPOSITORY_OWNER,,}.github.io"
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          npm run build

      # checks the fresh build (CSP hashes, no source maps); the pre-build test run leaves dist.test.ts out
      - run: npx vitest run dist.test.ts

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
