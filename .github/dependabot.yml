# Weekly update PRs. Security alerts themselves are switched on in GitHub: Settings > Code security.
# Every PR is checked by ci.yml before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # only safe bumps are bundled; a major bump arrives as its own PR so a failure points at one package
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint lags behind new TypeScript majors: TypeScript 7 made `npm ci` fail with ERESOLVE.
      # Bump manually once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # the types must match the Node version we build with, not the newest release
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # keeps the versions in the workflow files current (checkout, setup-node, pages actions)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # one PR for all action bumps, so each SHA pin and its version comment change together
      actions:
        patterns: ['*']
